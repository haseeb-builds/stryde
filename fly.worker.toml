app = "stryde-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.worker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  STRYDE_BROWSER_PORT = "3103"
  STRYDE_BROWSER_URL = "http://127.0.0.1:3103"
  STRYDE_WORKER_POLL_MS = "2000"
  STRYDE_WORKER_LEASE_SECONDS = "300"
