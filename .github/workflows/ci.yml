name: Stryde CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
      STRYDE_MODEL_PROVIDER: gemini
      STRYDE_MODEL_NAME: gemini-3.8-flash
      STRYDE_MODEL_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Build
        run: npm run build
