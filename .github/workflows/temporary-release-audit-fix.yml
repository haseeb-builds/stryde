name: Temporary release audit fix and verification
on:
  push:
    branches:
      - chore/release-baseline-security-2026-10-17
permissions:
  contents: write
jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/release-baseline-security-2026-10-17
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Match validated npm version
        run: npm install --global npm@11.9.0
      - name: Install cleanly
        run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix --no-fund || true
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pvijrnwdnolvnoibarrj.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          SUPABASE_SECRET_KEY: placeholder-secret-for-build-only
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-for-build-only
        run: npm run build
      - name: Assert production dependency audit is clean
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node -e "const x=JSON.parse(require('fs').readFileSync('audit-prod.json')); console.log(x.metadata.vulnerabilities); if (x.metadata.vulnerabilities.total !== 0) process.exit(1)"
      - name: Commit lockfile fix
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(release): apply non-breaking audit fixes"
          git push origin HEAD:chore/release-baseline-security-2026-10-17
