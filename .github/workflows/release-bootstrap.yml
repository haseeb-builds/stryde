name: Temporary release-hardening bootstrap

on:
  push:
    branches:
      - chore/release-baseline-security-2026-10-17

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'bootstrap: fix repo-root resolution'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: chore/release-baseline-security-2026-10-17

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned release dependencies
        run: npm ci

      - name: Fix script path resolution and make CI build reproducible
        shell: bash
        run: |
          cat > scripts/repo-root.mjs <<'EOF'
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          /** Resolve the repository root from a module's file URL, portably. */
          export function repoRootFromModuleUrl(moduleUrl) {
            return path.resolve(path.dirname(fileURLToPath(moduleUrl)), "..");
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          changed_files = []
          for path in Path("scripts").iterdir():
              if path.suffix not in (".ts", ".mjs"):
                  continue
              source = path.read_text()
              lines = source.splitlines()
              updated = []
              changed = False

              for line in lines:
                  if "const repoRoot = path.resolve(path.dirname(new URL(import.meta.url).pathname.replace" in line:
                      updated.append("const repoRoot = repoRootFromModuleUrl(import.meta.url);")
                      changed = True
                  elif "const repo = path.resolve(path.dirname(new URL(import.meta.url).pathname.replace" in line:
                      updated.append("const repo = repoRootFromModuleUrl(import.meta.url);")
                      changed = True
                  elif "const modulePath = path.resolve(decodeURIComponent(new URL(import.meta.url).pathname)" in line:
                      updated.append("const modulePath = fileURLToPath(import.meta.url);")
                      changed = True
                  elif 'cwd: new URL("..", import.meta.url).pathname.replace' in line:
                      updated.append("      cwd: repoRootFromModuleUrl(import.meta.url),")
                      changed = True
                  else:
                      updated.append(line)

              if changed:
                  source = "\n".join(updated) + "\n"
                  if "repoRootFromModuleUrl(" in source and 'import { repoRootFromModuleUrl } from "./repo-root.mjs";' not in source:
                      source = 'import { repoRootFromModuleUrl } from "./repo-root.mjs";\n' + source
                  if "fileURLToPath(import.meta.url)" in source and 'import { fileURLToPath } from "node:url";' not in source:
                      source = 'import { fileURLToPath } from "node:url";\n' + source
                  path.write_text(source)
                  changed_files.append(str(path))

          print("Updated URL path handling in:", ", ".join(changed_files))
          if len(changed_files) < 10:
              raise SystemExit(f"Expected to update the shared path pattern in at least 10 scripts; updated {len(changed_files)}")
          PY

          cat > tests/repo-root.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { accessSync } from "node:fs";
          import path from "node:path";
          import test from "node:test";
          import { repoRootFromModuleUrl } from "../scripts/repo-root.mjs";

          test("repo root resolution works from file URLs on the current platform", () => {
            const scriptUrl = new URL("../scripts/e2e-ui-flow.mjs", import.meta.url);
            const root = repoRootFromModuleUrl(scriptUrl.href);
            assert.equal(root, path.resolve(process.cwd()));
            accessSync(path.join(root, "package.json"));
          });
          EOF

          python3 <<'PY'
          from pathlib import Path

          p = Path(".github/workflows/ci.yml")
          source = p.read_text()
          anon = "      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder\n"
          assert anon in source
          if "SUPABASE_SECRET_KEY:" not in source:
              source = source.replace(
                  anon,
                  anon
                  + "      SUPABASE_SECRET_KEY: ci-placeholder-secret\n"
                  + "      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role\n",
                  1,
              )
          lint = "      - name: Lint\n        run: npm run lint\n"
          assert lint in source
          if "npm audit --omit=dev" not in source:
              source = source.replace(
                  lint,
                  lint + "\n      - name: Production dependency audit\n        run: npm audit --omit=dev\n",
                  1,
              )
          p.write_text(source)
          PY

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/api/v1/billing/checkout/route.ts")
          source = p.read_text()
          old = 'const { supabase, user } = await requireAuthenticatedSupabase(request.headers.get("authorization"));'
          new = 'const { user } = await requireAuthenticatedSupabase(request.headers.get("authorization"));'
          if old in source:
              source = source.replace(old, new, 1)
              p.write_text(source)
          PY

      - name: Verify release baseline
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pvijrnwdnolvnoibarrj.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SECRET_KEY: ci-placeholder-secret
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
        run: |
          npm test
          npx tsc --noEmit
          npm run lint
          npm audit --omit=dev
          npm run build

      - name: Commit release-hardening changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml app/api/v1/billing/checkout/route.ts scripts tests
          git commit -m "fix(release): resolve script paths and strengthen CI verification"
          git push origin HEAD:chore/release-baseline-security-2026-10-17
