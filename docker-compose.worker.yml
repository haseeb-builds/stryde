version: "3.8"

services:
  stryde-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "3103:3103"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY}}
      - STRYDE_BROWSER_PORT=3103
      - STRYDE_BROWSER_TOKEN=${STRYDE_BROWSER_TOKEN:-}
      - STRYDE_BROWSER_URL=http://127.0.0.1:3103
      - STRYDE_WORKER_POLL_MS=2000
      - STRYDE_WORKER_LEASE_SECONDS=300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
